<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crochet">
<title>Crochet Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#EDF3E4;--surface:#fff;--ink:#1F2E18;--muted:#58684F;--line:#D2DEC5;--leaf:#4F8C22;--soft:#DDEBC9;
  --font-d:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;--font-b:'Nunito',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10170E;--surface:#1A2416;--ink:#E7F0DE;--muted:#A1B396;--line:#33442C;--leaf:#8CC65A;--soft:#2B3C21;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
h1,h2{font-family:var(--font-d);font-weight:600;margin:0;line-height:1.15}
h1{font-size:40px}
.lead{color:var(--muted);font-size:19px;margin:6px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--leaf);outline:none}
.pic{background:var(--soft);border-radius:14px;display:grid;place-items:center;padding:14px}
.pic svg{width:120px;height:120px}
.card h2{font-size:24px}
.card p{margin:0;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:13px;font-weight:800;background:var(--soft);border-radius:999px;padding:2px 10px}
.go{margin-top:auto;font-weight:800;color:var(--leaf)}
footer{margin-top:40px;color:var(--muted);font-size:15px}
footer a{color:var(--leaf)}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Crochet Patterns</h1>
  <p class="lead">Step-by-step helpers for our crochet kits. Pick one to start.</p>
  <div class="grid">
    <a class="card" href="edwin/">
      <div class="pic"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="#86B84E"/><circle cx="31" cy="13" r="8" fill="#86B84E"/><ellipse cx="22" cy="27" rx="16" ry="14" fill="#86B84E"/><circle cx="13" cy="13" r="3.5" fill="#1b1b1b"/><circle cx="31" cy="13" r="3.5" fill="#1b1b1b"/><ellipse cx="22" cy="32" rx="8" ry="7" fill="#F3EDDC"/><circle cx="11" cy="25" r="2.5" fill="#EE9DAA"/><circle cx="33" cy="25" r="2.5" fill="#EE9DAA"/></svg></div>
      <h2>Edwin the Frog</h2>
      <p>A round green frog with a white belly and pink cheeks.</p>
      <div class="tags"><span>Beginner</span><span>Magic ring</span><span>sc · inc · dec</span></div>
      <span class="go">Start making &rarr;</span>
    </a>
  </div>
  <footer>Kits by CrochetBox. Basics videos: <a href="https://crochetbox.net/pages/crochet-101" target="_blank" rel="noopener">Crochet 101</a></footer>
</div>
</body>
</html>
